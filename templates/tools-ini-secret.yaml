{{- if not .Values.vault.enabled }}
# Dev/test fallback when Vault agent injection is not available.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nectar-tools.fullname" . }}-config
  labels:
    {{- include "nectar-tools.labels" . | nindent 4 }}
type: Opaque
stringData:
  tools.ini: |
    {{- .Values.conf.toolsIni | nindent 4 }}
{{- end }}
